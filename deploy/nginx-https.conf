limit_req_zone $binary_remote_addr zone=demo_api:10m rate=5r/s;
server {
    listen 80;
    server_name 83.147.192.229;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://83.147.192.229$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name 83.147.192.229;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/manufacturing-demo-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manufacturing-demo-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:demo_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=demo_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://dashboard:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://dashboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
