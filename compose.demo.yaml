name: manufacturing-demo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manufacturing_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
    volumes:
      - demo_data:/var/lib/postgresql/data
      - ./ops/wal:/wal-archive
      - ./deploy/archive-wal.sh:/opt/archive-wal.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migrations/02-august.sql:/docker-entrypoint-initdb.d/02-august.sql:ro
      - ./db/migrations/03-order-items.sql:/docker-entrypoint-initdb.d/03-order-items.sql:ro
      - ./db/migrations/05-claims.sql:/docker-entrypoint-initdb.d/05-claims.sql:ro
      - ./db/migrations/06-return-scenario.sql:/docker-entrypoint-initdb.d/06-return-scenario.sql:ro
      - ./db/migrations/07-projects.sql:/docker-entrypoint-initdb.d/07-projects.sql:ro
      - ./db/migrations/08-operations.sql:/docker-entrypoint-initdb.d/08-operations.sql:ro
      - ./db/migrations/09-evidence-examples.sql:/docker-entrypoint-initdb.d/09-evidence-examples.sql:ro
      - ./db/migrations/10-september-14.sql:/docker-entrypoint-initdb.d/10-september-14.sql:ro
      - ./deploy/04-password.sh:/docker-entrypoint-initdb.d/04-password.sh:ro
    command: [postgres, -c, archive_mode=on, -c, archive_timeout=300, -c, 'archive_command=sh /opt/archive-wal.sh %p %f']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d manufacturing_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  dashboard:
    build: .
    environment:
      DB_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGO_READER_PASSWORD: ${MONGO_READER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./ops/public:/app/ops-status:ro
  web:
    image: nginx:stable-alpine
    ports:
      - "${DEMO_BIND_ADDRESS:-0.0.0.0}:${DEMO_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./acme:/var/www/certbot:ro
    depends_on:
      - dashboard
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    command: [mongod, --wiredTigerCacheSizeGB, '0.25', --bind_ip_all]
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: operator
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run deploy/prepare-ops-env.py}
      MONGO_READER_PASSWORD: ${MONGO_READER_PASSWORD:?Run deploy/prepare-ops-env.py}
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/01-protocols.js:ro
    restart: unless-stopped

volumes:
  demo_data:
  mongo_data:
